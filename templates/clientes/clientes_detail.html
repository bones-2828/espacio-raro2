{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalles del Cliente</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <div class="card shadow p-4">
      <h3>👤 Detalles del Cliente</h3>
      <ul class="list-group list-group-flush mt-3">
        <li class="list-group-item"><strong>ID:</strong> {{ cliente.id_cliente }}</li>
        <li class="list-group-item"><strong>Nombre:</strong> {{ cliente.nombre }}</li>
        <li class="list-group-item"><strong>Apellido:</strong> {{ cliente.apellido }}</li>
        <li class="list-group-item"><strong>Email:</strong> {{ cliente.email }}</li>
        <li class="list-group-item"><strong>Teléfono:</strong> {{ cliente.telefono }}</li>
      </ul>
      <div class="mt-4 text-end">
        <a href="{% url 'clientes_update' cliente.id_cliente %}" class="btn btn-warning">✏️ Editar</a>
        <a href="{% url 'clientes_list' %}" class="btn btn-secondary">⬅️ Volver</a>
      </div>
    </div>
  </div>

  <footer class="text-center mt-5 bg-dark text-light p-3">
    <p>Proyecto Espacio Raro | Detalles de Cliente</p>
  </footer>
</body>
</html>
