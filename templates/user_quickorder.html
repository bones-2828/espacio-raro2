{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedido rápido</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .container { max-width: 600px; margin-top: 50px; }
    .card { padding: 30px; box-shadow: 0 0 15px rgba(0,0,0,0.1); }
    footer { text-align:center; margin-top:50px; color:#666; }
  </style>
</head>
<body>

<div class="container">
  <div class="card">
    <h3 class="text-center mb-4">📦 Pedido Rápido con tu cuenta</h3>

    <form method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="mb-3">
        <label class="form-label">Nombre completo</label>
        <input type="text" class="form-control" value="{{ cliente.nombre }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Correo electrónico</label>
        <input type="email" class="form-control" value="{{ cliente.email }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">RUT</label>
        <input type="text" class="form-control" value="{{ cliente.rut }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Dirección</label>
        <input type="text" class="form-control" value="{{ cliente.direccion }}" readonly>
      </div>

      <div class="mb-3">
        <label class="form-label">Mensaje adicional</label>
        <textarea name="mensaje" class="form-control" rows="3" placeholder="Agrega detalles o instrucciones..."></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label">Imagen de referencia (opcional)</label>
        <input type="file" name="imagen" class="form-control" accept="image/*">
      </div>

      <div class="text-center mt-3">
        <button type="submit" class="btn btn-success px-4">Enviar Pedido</button>
        <a href="{% url 'user_dashboard' %}" class="btn btn-secondary px-4">Volver</a>
      </div>
    </form>
  </div>
</div>

<footer>
  <p>Proyecto Espacio Raro — Pedido con cuenta</p>
</footer>

</body>
</html>
